# The lane STAYS PAPER: wave_shape is in PAPER_LANE_NAMES and not in LIVE_LANES; no .env change.
#
# Exact edits:
#   1. In [lane.wave_shape], change ONE line:
#        buy_module = "wave_shape_buy"
#      to
#        buy_module = "wave_turn_buy"   # 2026-11-24 (user: paper only): the turn rule plus the pre-open choppiness gate from the study on the user's own marked buys (scripts/wave_turn_chop.py)
#      and (optional, wording only) the label to:
#        label = "wave turn (PAPER): a swing of 0.5 typical minutes bought once 0.2 has come back, NO after a rise, YES after a fall, side by the target, only in a market whose pre-open hour was choppy; wave_exit unchanged"
#      Every other setting of the lane stays as it is (exit_module = "wave_exit" and its settings, entry_elapsed = [2, 10], price = [0.01, 0.99],
#      fixed_stake, max_open, the resting buy).
#   2. Add the module below. Keep [module.wave_shape_buy] in the file until waveshape.py is removed (it then serves no lane).

[module.wave_turn_buy]
label = "the wave turn: a swing of >= 0.5 u on the 30 s median bought once 0.2 u has come back, once per swing, side by the target (0.5 u band), gated on the pre-open hour's crossings of each window's open (>= 8 per 15 min); the trend reading stays in shadow"
steps = ["price", "entry_window", "wave_turn", "wave_trend"]   # wave_flag_buy's list with wave_turn in place of wave_flag; price is the structural bound only (the lane price = [0.01, 0.99]: the test_filter_steps policy needs a price step when a lane sets one; it refuses almost nothing); entry_window is the lane's existing window (2-10 min), wave_trend is shadow and never says no; nothing else can turn a buy down
