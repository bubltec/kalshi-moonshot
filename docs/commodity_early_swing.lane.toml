# 2026-11-20 PAPER, SHADOW-GRADE: NOT in data/strategies.toml (untracked and shipped by cloud_push.sh; the parent session is deploying). THE STUDY DID NOT SUPPORT THIS LANE: studies/results/2026-11-20-early-swing-commodity.txt (4,341 commodity sides on Kalshi's perp reference, ask 0.20-0.45, resting sell +40/+70/+100%: net -0.160/-0.137/-0.115 per $1, held -0.060; every third of every curve reading negative; least bad: high 15-minute range, +100% -0.047). It is built because the user asked for it ("those bets hit too": hit 0.65/0.53/0.45), with the gate set strictly, to be scored forward and retired under rule 6 when its score is negative. Paste both blocks into data/strategies.toml, add commodity_early_swing to PAPER_LANE_NAMES in .env (the user's word needed), and push with --build (the lane needs the swing_risk step, on branch jjosef/early-swing-e7d4b9).
[lane.commodity_early_swing]
enabled = true
label = "commodity early swing: a cheap side in the first minutes, only when the risk model's best exit is an early sale and its score is in the top 3% of the market's own last three hours; sold on the way back from its high (PAPER, the study did not support it)"
estimator = "market"
numeric = "allow"
one_per = "event"
series = ["KXGOLD15M", "KXSILVER15M", "KXWTI15M", "KXBRENT15M", "KXNATGAS15M", "KXCOPPER15M", "KXPLATINUM15M", "KXPALLADIUM15M"]
sides = ["yes", "no"]
timed_suffix = "15M"
shadow_suffix = "15M"
price = [0.20, 0.45]  # the study's band (the low-swing lane's 0.10-0.45, without the under-0.20 sides the study found worst)
entry_elapsed = [1.0, 4.0]  # minutes after the open: the study's 60-240 s
hours = [0.0, 0.26]
max_spread = 0.03
min_volume = 0
buy_module = "swing_commodity"
exit_module = "round_trip"
priority = 46
shortlist = 12
scope_minutes = 2
review_minutes = 1
cooldown_minutes = 3.0
buy_max_move = 0.05
buy_retry_chase = 0.02
buy_slip = 0.03
buy_tick_ahead = true
fixed_stake = 2.0
max_open = 8
max_bet_pct = 0.5
max_exposure_pct = 0.4
paper_fill_model = true

[module.swing_commodity]
label = "the lane's gates say what is eligible, the swing risk model decides last: an early sale is the best exit and the score is in the top 3% of the market's own last three hours"
steps = ["price", "cooldown", "swing_risk"]
reentry_cooldown_seconds = 900  # no buy-back of a market the lane has sold: the market's length, structural
