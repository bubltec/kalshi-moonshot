[project]
name = "kalshi-moonshot"
version = "0.2.0"
description = "Lane-based scanner and capped trader for Kalshi event contracts"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "cryptography>=43,<50",
  "websockets>=13,<16",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
kalshi-moonshot = "kalshi_moonshot.__main__:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalshi_moonshot = ["instruments.toml", "rules.toml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["kalshi_moonshot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "FURB", "RUF", "C4", "PIE"]
# E501: line length is advisory until the code base is run through `ruff format`.
# BLE001 is not selected: the run loop and model calls deliberately catch broad errors so
# one bad pass never stops the bot.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kalshi_moonshot"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
