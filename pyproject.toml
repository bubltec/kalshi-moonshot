[project]
name = "kalshi-moonshot"
version = "0.1.0"
description = "Long-shot scanner and capped trader for Kalshi event contracts"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The run loop and model calls deliberately catch broad errors so one bad pass never stops the bot.
ignore = ["BLE001"]
