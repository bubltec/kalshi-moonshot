# The bot, the tape recorder (a process of its own since 2026-11-14) and the database on one machine. No Ollama: the model stays on the Mac, and a review
# that cannot reach it skips. Images are filled in by the stack (infra/bot_stack.py).
services:
  bot:
    image: BOT_IMAGE
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: /mnt/moonshot/env/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      TAPE_DIR: /tape
      DATABASE_URL: postgresql://moonshot:${POSTGRES_PASSWORD:-moonshot}@db:5432/moonshot
      DB_SCHEMA_MAIN: moonshot
      DB_SCHEMA_TAPE: tape
      TAPE_ROLE: memory  # the recorder below writes the Kalshi side of the tape; this process keeps those streams for its own memory (and writes them itself again if the recorder goes silent for two minutes)
    volumes:
      - /mnt/moonshot/data:/data
      - /mnt/moonshot/secrets:/app/.secrets:ro
      - /mnt/moonshot/env/.env:/app/.env:ro

  # The tape recorder: Kalshi's market, settlement-index and extra-series sockets and the perp reference, written to the tape. It runs from the image tagged :recorder, which scripts/cloud_push.sh --recorder moves and an ordinary --build does not, so a bot update recreates the bot and leaves this container (and the tape it is writing) alone.
  recorder:
    image: RECORDER_IMAGE
    command: ["python", "-m", "kalshi_moonshot", "record"]
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 1g  # 2026-11-15: 512m killed the recorder once (05:03 ET, 521 MiB) while it grew about 70 MiB an hour; raised first, the leak is found next
    env_file: /mnt/moonshot/env/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      TAPE_DIR: /tape
      DATABASE_URL: postgresql://moonshot:${POSTGRES_PASSWORD:-moonshot}@db:5432/moonshot
      DB_SCHEMA_MAIN: moonshot
      DB_SCHEMA_TAPE: tape
    volumes:
      - /mnt/moonshot/data:/data
      - /mnt/moonshot/secrets:/app/.secrets:ro
      - /mnt/moonshot/env/.env:/app/.env:ro

  db:
    image: DB_IMAGE
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: moonshot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moonshot}
      POSTGRES_DB: moonshot
    volumes:
      - /mnt/moonshot/pgdata:/var/lib/postgresql
    shm_size: 256mb
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=on", "-c", "max_connections=150"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonshot -d moonshot"]
      interval: 5s
      timeout: 5s
      retries: 20
