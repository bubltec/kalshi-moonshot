# Which Kalshi series the ladder estimator can price, and the free price feed it reads for each.
# Add a series here instead of editing code. A copy in DATA_DIR overrides this one.
# `suffixes` are the period codes after the prefix (D daily, H hourly, W weekly, 15M fifteen-minute,
# "" none). Monthly and annual series are left out on purpose: realized volatility is a poor guide
# that far out.
#
# Feeds, all free and keyless, all real-time:
#   kraken:PAIR   Kraken's WebSocket v2 ticker. Crypto spot.
#   hl:xyz:COIN   Hyperliquid's "xyz" builder market: deep gold, silver, oil, gas, copper, platinum and
#                 palladium perpetuals, trading around the clock.
# `realtime` marks a feed that is current to a few seconds (a dead one is refused outright). `proxy`
# marks a feed that tracks the asset with an offset from what Kalshi settles on. For a proxy the
# pricer measures that offset instead of assuming it: from the event's own ladder where there is one,
# and for 15-minute series from the last settled windows, whose strikes and settlement values are
# Kalshi's exact reference at every 15-minute boundary.
#
# Anything else is a Yahoo Finance symbol: futures are about 10 minutes old, so the pricer widens
# its uncertainty by the feed's age and 15-minute series are not listed.

[[instrument]]
prefix = "KXGOLD"
symbol = "hl:xyz:GOLD"
suffixes = ["D", "H", "W", "15M"]
realtime = true
proxy = true

[[instrument]]
prefix = "KXSILVER"
symbol = "hl:xyz:SILVER"
suffixes = ["D", "H", "W", "15M"]
realtime = true
proxy = true

