# --- New markets. Currencies are live; indices and Brent stay paper only (`live = false`): a live lane prices and logs them but never sends an order for them until
# you flip the switch here. Currencies use Hyperliquid's EUR/GBP/JPY perpetuals, or Kraken's spot FX where there is no perp.
# Indices use the S&P 500 and Nasdaq-100 perps (Kalshi's index markets run in US trading hours); Brent adds its 15-minute series.

[[instrument]]
prefix = "KXEURUSD"
symbol = "hl:xyz:EUR"
suffixes = ["15M"]
realtime = true
proxy = true
live = true

[[instrument]]
