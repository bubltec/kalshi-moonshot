# A lane that buys the favourite of a 15-minute commodity or coin market through a buy module and sells through an exit module.
#
# Since 2026-11-19 (user: "we don't use anything outside modules for buying and selling") a lane decides what to buy only through
# its buy module's steps (src/kalshi_moonshot/buychain.py) and what to sell only through its exit module's steps
# (src/kalshi_moonshot/sellchain.py). The lane itself says what it looks at (series, sides, price band, time window, spread),
# how big a bet is, and how the order is placed. A module is a named list of steps with the settings those steps read.
#
# To use it, copy this file to  data/strategies.toml  (after rebuilding: an older build rejects a field it does not know).
# It starts as paper only: 15-minute windows place real orders only when COMMODITY_15M_LIVE=true AND the lane is named in LIVE_LANES.

[lane.example]
estimator = "ladder"            # prices each window from the live feed; its note is logged
needs_model_edge = false
fixed_stake = 2.0               # dollars per bet
sides = ["yes", "no"]
price = [0.60, 0.92]            # what one contract costs
hours = [0.0, 0.26]             # 15-minute windows only
max_spread = 0.03
min_volume = 0
shortlist = 12
one_per = "event"
needs_instrument = true
numeric = "allow"
series = ["KXGOLD15M", "KXSILVER15M", "KXWTI15M"]
timed_suffix = "15M"
shadow_suffix = "15M"
entry_elapsed = [7.0, 14.0]     # minutes after the window opens
scope_minutes = 2
review_minutes = 1
max_open = 3
max_exposure_pct = 0.30         # all open bets in this lane, share of equity
buy_module = "favourite"
exit_module = "hold_and_trail"

[module.favourite]
label = "the lane's gates say what is eligible, then the curve's own readings"
steps = ["price", "vol_regime", "cushion", "price_trend", "spike"]
max_vol_rel = 1.6               # vol_regime: no buy while the market's volatility is over 1.6 times its normal
min_cushion_z = 0.8             # cushion: the spot at least 0.8 typical moves on the side's side of the strike
max_spot_crosses = 4            # cushion: fewer than 4 crossings of the strike in five minutes
entry_trend_seconds = 60        # price_trend: the side's price has not fallen over the last minute
entry_spike_seconds = 90        # spike: and has not just run 30 cents

[exit.hold_and_trail]
label = "a loser rides; a gain is sold once its bid is one typical minute under its high"
steps = ["under_even", "trail"]
curve_risk_live = true
curve_risk_spot_weight = 0.0

[exit.hold_and_trail.profit]
curve_take = true
curve_take_trail = 1.0
curve_take_trail_live = true

[exit.hold_and_trail.loss]
curve_risk_under_even = 0.1
curve_risk_under_even_live = true
