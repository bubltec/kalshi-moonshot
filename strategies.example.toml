# A lane that buys the favourite of a 15-minute commodity or coin market through a buy module and sells through an exit module.
#
# Since 2026-11-19 (user: "we don't use anything outside modules for buying and selling") a lane decides what to buy only through
# its buy module's steps (src/kalshi_moonshot/buychain.py) and what to sell only through its exit module's steps
# (src/kalshi_moonshot/sellchain.py). The lane itself says what it looks at (series, sides, price band, time window, spread),
# how big a bet is, and how the order is placed. A module is a named list of steps with the settings those steps read.
#
# To use it, copy this file to  data/strategies.toml  (after rebuilding: an older build rejects a field it does not know).
# It starts as paper only: 15-minute windows place real orders only when COMMODITY_15M_LIVE=true AND the lane is named in LIVE_LANES.

[lane.example]
estimator = "ladder"            # prices each window from the live feed; its note is logged
needs_model_edge = false
fixed_stake = 2.0               # dollars per bet
sides = ["yes", "no"]
price = [0.60, 0.92]            # what one contract costs
hours = [0.0, 0.26]             # 15-minute windows only
max_spread = 0.03
min_volume = 0
shortlist = 12
one_per = "event"
needs_instrument = true
numeric = "allow"
series = ["KXGOLD15M", "KXSILVER15M", "KXWTI15M"]
timed_suffix = "15M"
shadow_suffix = "15M"
entry_elapsed = [7.0, 14.0]     # minutes after the window opens
scope_minutes = 2
review_minutes = 1
max_open = 3
max_exposure_pct = 0.30         # all open bets in this lane, share of equity
buy_module = "favourite"
exit_module = "hold_and_trail"

[module.favourite]
label = "the lane's gates say what is eligible, then the curve's own readings"
# 2026-11-21: the lane filter's checks are steps now (spread, entry_window), so this list is everything that can turn a buy down; before, the filter applied them unlisted.
steps = ["price", "spread", "entry_window", "vol_regime", "cushion", "price_trend", "spike"]
max_vol_rel = 1.6               # vol_regime: no buy while the market's volatility is over 1.6 times its normal
min_cushion_z = 0.8             # cushion: the spot at least 0.8 typical moves on the side's side of the strike
max_spot_crosses = 4            # cushion: fewer than 4 crossings of the strike in five minutes
entry_trend_seconds = 60        # price_trend: the side's price has not fallen over the last minute
entry_spike_seconds = 90        # spike: and has not just run 30 cents

[exit.hold_and_trail]
label = "a loser rides; a gain is sold once its bid is one typical minute under its high"
steps = ["under_even", "trail"]
curve_risk_live = true
curve_risk_spot_weight = 0.0

[exit.hold_and_trail.profit]
curve_take = true
curve_take_trail = 1.0
curve_take_trail_live = true

[exit.hold_and_trail.loss]
curve_risk_under_even = 0.1
curve_risk_under_even_live = true

# The wave-top reversal lane (2026-11-21, PAPER; the user's hand scalp, src/kalshi_moonshot/wavetop.py): the cheap side at the top of a spot wave bigger than
# the waves before it (NO on a peak, YES on a dip), bought 2 to 8 minutes after the open, about 25 contracts. A bet that dips is sold once it has come back
# (wave_salvage); a bet that never dips is held. Evidence and limits: studies/results/2026-11-21-spot-wave-*.txt (a lead at about two standard errors, settings
# chosen after seeing results). Series are the scope, not a rule: every 15-minute market with a Kalshi index or perp reference.
[lane.wave_top]
enabled = true
label = "wave top: the cheap side at a peak above or a dip below the target, bought as the spot turns on the 60 s average, sold at +20c once it stops rising or at +40c (PAPER)"
estimator = "market"
numeric = "allow"
one_per = "event"
series = ["KXBTC15M", "KXETH15M", "KXSOL15M", "KXXRP15M", "KXDOGE15M", "KXADA15M", "KXBCH15M", "KXBNB15M", "KXHYPE15M", "KXNEAR15M", "KXZEC15M", "KXGOLD15M", "KXSILVER15M", "KXWTI15M", "KXBRENT15M", "KXNATGAS15M", "KXCOPPER15M", "KXPLATINUM15M", "KXPALLADIUM15M"]
sides = ["yes", "no"]
timed_suffix = "15M"
shadow_suffix = "15M"
price = [0.18, 0.40]             # the user's own band (2026-11-21)
hours = [0.0, 0.26]
entry_elapsed = [0, 8]          # minutes after the open: later wave tops lost in the study. No wait at the open (user, 2026-11-21: the minute-2 start was not asked for)
max_spread = 1.0                # no spread limit (user, 2026-11-21: a spread limit conflicts with this lane's purpose)
min_volume = 0
shortlist = 12
scope_minutes = 2
review_minutes = 1
fixed_stake = 7.5               # about 25 contracts at 0.30
buy_rest_seconds = 5            # 2026-11-22 (user: the lane should not take the price right at the ask the moment the peak shows; "fluttering on the price for a few moments and that's when you bet under a cent or 2"): a resting buy under the ask for a few seconds, the commodity lanes' 5. Paper: judged on the tape, filled only if the ask comes down to it, else no bet (paperfill.settle)
buy_rest_follow = true          # 2026-11-22 (user: "the bot can operate much faster and sees every tick"): the order moves down to a cent or two under the ask as it falls, at most 3 times; paper is judged the same way (paperfill._follow_down)
buy_rest_avg_seconds = 5        # 2026-11-22 (user: "when it's peaking it's going to flutter up and down ... you could take an average of like 5s"): the order starts under the lower of the ask and its 5-second average ask (restprice.py)
buy_rest_below = 0.02          # how far under the ask the buy rests: the user's "a cent or 2" (the commodity lanes rest 1c)
max_open = 30
max_exposure_pct = 0.4
paper_fill_model = true
priority = 43
wave_top_trend_hours = 1.0      # no dip bet when the spot at the open is above its value an hour before
buy_module = "wave_top"
exit_module = "wave_exit"

[module.wave_top]
label = "the market is in its own range, the cheap side is the reversal of a big spot wave at its top"
# 2026-11-21: the lane filter's checks are steps now (entry_window; no spread step, the user took the spread limit out), so this list is everything that can turn a buy down; before, the filter applied them unlisted.
steps = ["price", "entry_window", "calm", "wave_top"]

[exit.wave_exit]
label = "a bet that dipped is sold once it has come back and its climb has faded; one that never dipped is held"
steps = ["wave_take", "wave_salvage"]  # 2026-11-22: the user's own exit (the +40c resting sale, +20c once the move slows) joins the salvage sale; the first version had only the salvage
curve_risk_live = true

[exit.wave_exit.profit]

[exit.wave_exit.loss]
