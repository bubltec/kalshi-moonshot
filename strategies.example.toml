# A lane that buys 15-minute "Up"/"Down" contracts at long-shot prices for a fixed stake, like the
# positions in the Kalshi app: about $2 each at 12-30 cents, paying 3x to 8x.
#
# To use it, copy this file to  data/strategies.toml  (after rebuilding: an older build rejects the
# new fields). It starts as paper only: 15-minute windows place real orders only when
# COMMODITY_15M_LIVE=true AND the lane is named in LIVE_LANES. Watch it with
#   python -m kalshi_moonshot daily --paper --lane fifteen
#
# History says this style loses on average (buying 12-30 cent Up contracts returned -5% to -30%
# depending on the minute, with a break-even near the first and last minutes). The paper results are
# the real test, so it keeps score instead of trusting the idea.

[lane.fifteen]
estimator = "ladder"            # prices each window from the live feed; only used to log our chance
always = true                   # bet whenever the filters pass: no minimum edge
fixed_stake = 2.0               # dollars per bet
sides = ["yes", "no"]           # "Up" is YES, "Down" is NO
price = [0.12, 0.30]            # what one contract costs
hours = [0.03, 0.25]            # 15-minute windows only
max_spread = 0.03
min_volume = 5
shortlist = 12
one_per = "event"
needs_instrument = true
numeric = "allow"               # price-threshold markets are the point of this lane
series = ["KXBTC15M", "KXETH15M", "KXSOL15M", "KXXRP15M", "KXDOGE15M", "KXGOLD15M",
          "KXSILVER15M", "KXWTI15M", "KXCOPPER15M", "KXNATGAS15M", "KXPLATINUM15M", "KXPALLADIUM15M"]
timed_suffix = "15M"
timed_minutes = 15
entry_elapsed = [1, 12]         # minutes after the window opens
scope_minutes = 3
review_minutes = 1
# entry_socket = true           # also review a watched event the moment a streamed quote enters the price band (needs the tape recorder; the polled review stays as the fallback)
priority = 10
max_exposure_pct = 0.30         # all open bets in this lane, share of equity


# A control for the steady lane: the same markets, price band and rising-price rule, but every one that passes
# the filters is bought for a flat $2, with no model gate. Run beside `steady`, it shows whether the model's
# yes/no adds anything. Paper only: it is never named in LIVE_LANES. Compare with
#   python -m kalshi_moonshot report      (lane rows)   and   python -m kalshi_moonshot daily --lane steady_raw

[lane.steady_raw]
shares_markets = true         # takes the same markets as steady, so the two can be compared
estimator = "llm"               # still asked, so its estimate is logged and scored; it just no longer decides
label = "steady"
always = true
fixed_stake = 2.0
price = [0.66, 0.75]
hours = [1, 72]
max_spread = 0.03
min_volume = 200
shortlist = 10
trend = "rising"
lookback_hours = 6
min_trend = 0.02
one_per = "mutex"
sides = ["yes", "no"]
max_exposure_pct = 0.30


# Late tickets: the cheap side of a 15-minute window in its last 2-3 minutes, only when the feed is within a
# quarter of an expected move of the strike (the estimator's chance that the side pays is 40-50%; the distance is
# scaled by each instrument's own volatility, so gold dollars and silver cents count alike). A fixed $1.
# Backtest (2026-10-20, about 600 windows): 87 such tickets paid 25.4 cents and won 27.6% (+3% after fees), the
# only bucket near break-even and too few to trust, so this runs on paper to build the record. It never trades
# live unless it is named in LIVE_LANES. Watch it with  python -m kalshi_moonshot mytrades --source bot  or  daily --lane late_ticket

[lane.late_ticket]
estimator = "ladder"
label = "late ticket"
always = true
fixed_stake = 1.0
sides = ["yes", "no"]
price = [0.05, 0.40]
min_chance = 0.40               # the estimator's chance this side pays, i.e. within ~0.25 sigma of the strike
max_chance = 0.50
hours = [0.01, 0.26]            # any 15-minute window; the entry window below picks the last 3.5 minutes
max_spread = 0.04
min_volume = 5
shortlist = 12
one_per = "event"
needs_instrument = true
numeric = "allow"               # price-threshold markets are the point of this lane
series = ["KXBTC15M", "KXETH15M", "KXSOL15M", "KXXRP15M", "KXDOGE15M", "KXGOLD15M",
          "KXSILVER15M", "KXWTI15M", "KXCOPPER15M", "KXNATGAS15M", "KXPLATINUM15M", "KXPALLADIUM15M",
          "KXEURUSD15M", "KXGBPUSD15M", "KXUSDJPY15M", "KXAUDUSD15M", "KXUSDCAD15M", "KXINX15M", "KXNDQ15M", "KXBRENT15M"]
timed_suffix = "15M"
timed_minutes = 15
entry_elapsed = [4, 13.5]       # minutes after the window opens: not in the first 4, when a window has no information and the book is thin
scope_minutes = 3
review_minutes = 1
priority = 10
max_exposure_pct = 0.10
take_profit_x = 3.0             # sell when the bid reaches 3x the price paid, watched live on the socket
spike_cents = 0.10              # ...or when the bid jumps 10 cents within spike_seconds while in profit
spike_seconds = 30


# The same late-ticket entries with a peak-crash exit: once the bid has been 10% above the price paid, sell when it falls
# 4 cents from its peak, watched live on the socket. It runs beside late_ticket (3x or a spike) so the two exits are compared
# on the same kind of bet. Backtests on quote ticks say holding beat this, so it is an experiment. Paper only.
stop_loss = false

[lane.late_ticket_trail]
estimator = "ladder"
label = "late ticket"
always = true
fixed_stake = 1.0
sides = ["yes", "no"]
price = [0.05, 0.40]
min_chance = 0.40
max_chance = 0.50
hours = [0.01, 0.26]
max_spread = 0.04
min_volume = 5
shortlist = 12
one_per = "event"
needs_instrument = true
numeric = "allow"
series = ["KXBTC15M", "KXETH15M", "KXSOL15M", "KXXRP15M", "KXDOGE15M", "KXGOLD15M",
          "KXSILVER15M", "KXWTI15M", "KXCOPPER15M", "KXNATGAS15M", "KXPLATINUM15M", "KXPALLADIUM15M",
          "KXEURUSD15M", "KXGBPUSD15M", "KXUSDJPY15M", "KXAUDUSD15M", "KXUSDCAD15M", "KXINX15M", "KXNDQ15M", "KXBRENT15M"]
timed_suffix = "15M"
timed_minutes = 15
entry_elapsed = [4, 13.5]
scope_minutes = 3
review_minutes = 1
priority = 10
max_exposure_pct = 0.10
trail_activate = 0.10
trail_drop = 0.04


# Currency tickets: the cheap side of the five FX 15-minute markets, near the strike, flat $1 each, entered from minute 4.
# Sells on a spike (a 10-cent jump in 30 s while at least 10% up) or a peak-crash (up 10%, then 4 cents off a held peak for
# 10 s). It is live only when LIVE_LANES in .env names it; until then it paper-trades.
stop_loss = false

[lane.fx_ticket]
estimator = "ladder"
label = "currency ticket"
always = true
fixed_stake = 1.0
sides = ["yes", "no"]
price = [0.05, 0.40]
min_chance = 0.30               # currency history: the 30-50% chance bands are the ones that held up (see scripts/late_ticket_study.py)
max_chance = 0.50
hours = [0.01, 0.26]
max_spread = 0.04
min_volume = 5
shortlist = 12
one_per = "event"
needs_instrument = true
numeric = "allow"
series = ["KXEURUSD15M", "KXGBPUSD15M", "KXUSDJPY15M", "KXAUDUSD15M", "KXUSDCAD15M"]
timed_suffix = "15M"
timed_minutes = 15
entry_elapsed = [1, 14]          # the whole window: the learned gate decides which minutes may trade
scope_minutes = 3
review_minutes = 1
priority = 10
max_exposure_pct = 0.10
trail_activate = 0.10
trail_drop = 0.04
stop_loss = false
gate_from = ["late_ticket", "late_ticket_trail", "fx_ticket"]   # the lanes whose finished bets decide which minutes may trade
gate_min_n = 30
gate_z = 1.0


# Last-minute lottery tickets (paper experiment): the 0.2-5 cent side of a commodity 15-minute market in its last minute, held to
# settlement, a flat 50 cents. Winners are rare (about 1%) and pay 20x-100x. Backtest on 3 days of ticks: buying every such ticket
# returned about -30% on gold/silver/oil, so this paper lane exists to collect a record and to test whether a trend toward the
# strike separates the winners. Never live unless it is named in LIVE_LANES.

[lane.last_minute]
estimator = "ladder"
label = "last-minute ticket"
always = true
fixed_stake = 0.5
sides = ["yes", "no"]
price = [0.002, 0.05]
hours = [0.003, 0.26]           # any 15-minute window; entry_elapsed below picks the last minute
max_spread = 0.03
min_volume = 0
shortlist = 20
one_per = "event"
needs_instrument = true
numeric = "allow"
series = ["KXGOLD15M", "KXSILVER15M", "KXWTI15M", "KXCOPPER15M", "KXNATGAS15M", "KXPLATINUM15M", "KXPALLADIUM15M"]
timed_suffix = "15M"
timed_minutes = 15
entry_elapsed = [14, 14.9]
scope_minutes = 3
review_minutes = 0.5
priority = 10
max_exposure_pct = 0.05
stop_loss = false


# Currency favorites (paper experiment): the side priced 70-80 cents in minutes 8-10 of a currency 15-minute window, held to
# settlement, a flat $2. It copies a public "lock" counter that showed 17 straight wins on GBP/USD overnight. A plain version of that
# rule won 12 of 13 overnight but only 65-68% on the two days before, which loses at these prices, so this lane records forward
# results (see `daily --lane fx_favorite`, `bymin`) before any real money is considered. Never live unless named in LIVE_LANES.

[lane.fx_favorite]
estimator = "ladder"
label = "currency favorite"
always = true
fixed_stake = 2.0
sides = ["yes", "no"]
price = [0.59, 0.85]
hours = [0.03, 0.26]
max_spread = 0.03
min_volume = 0
shortlist = 12
one_per = "event"
needs_instrument = true
numeric = "allow"
series = ["KXEURUSD15M", "KXGBPUSD15M", "KXUSDJPY15M", "KXAUDUSD15M", "KXUSDCAD15M"]
timed_suffix = "15M"
timed_minutes = 15
entry_elapsed = [4, 10.5]
scope_minutes = 3
review_minutes = 1
priority = 10
max_exposure_pct = 0.10
stop_loss = false


# Your pattern, as a paper lane: buy a currency side priced about 30 cents mid-window, ride it up, sell on a held dip from the peak.
# It does not have to reach the target to profit. Entry is the same as the reset fx_ticket, so what this records is what fx_ticket's
# learned gate judges. Never live unless named in LIVE_LANES.

[lane.fx_trail30]
estimator = "ladder"
label = "currency 30c trail"
always = true
fixed_stake = 1.0
sides = ["yes", "no"]
price = [0.10, 0.39]
hours = [0.03, 0.26]
max_spread = 0.04
min_volume = 0
shortlist = 12
one_per = "event"
needs_instrument = true
numeric = "allow"
series = ["KXEURUSD15M", "KXGBPUSD15M", "KXUSDJPY15M", "KXAUDUSD15M", "KXUSDCAD15M"]
timed_suffix = "15M"
timed_minutes = 15
entry_elapsed = [4, 12]
scope_minutes = 3
review_minutes = 1
priority = 10
max_exposure_pct = 0.10
stop_loss = false
trail_activate = 0.10
trail_drop = 0.04
trail_confirm_seconds = 10
trail_fast_drop = 0.12
